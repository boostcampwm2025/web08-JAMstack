name: CD Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies and build packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @codejam/common build
          pnpm --filter @codejam/ui build

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Build client for Vercel
        run: |
          cd apps/client

          cat > vercel.json <<'EOF'
          {
            "rewrites": [
              {
                "source": "/api/(.*)",
                "destination": "https://api.codejam.app/api/$1"
              },
              {
                "source": "/(.*)",
                "destination": "/index.html"
              }
            ]
          }
          EOF

          mkdir -p .vercel
          cat > .vercel/project.json <<'EOF'
          {
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectName": "codejam"
          }
          EOF
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/client
          vercel-args: '--prod --prebuilt'

      - name: Build server and dependencies
        run: pnpm --filter server... build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OCIR Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGION_KEY }}.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and push Docker image (OCIR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ${{ secrets.OCIR_REGION_KEY }}.ocir.io/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}:production
            ${{ secrets.OCIR_REGION_KEY }}.ocir.io/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}:latest
            ${{ secrets.OCIR_REGION_KEY }}.ocir.io/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}:prod-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.OCIR_REGION_KEY }}.ocir.io/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}:production
          cache-to: type=inline

      - name: Deploy to NCP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_SSH_KEY }}
          port: ${{ secrets.NCP_PORT }}
          script: |
            docker login -u ${{ secrets.OCIR_USERNAME }} -p ${{ secrets.OCIR_AUTH_TOKEN }} ${{ secrets.OCIR_REGION_KEY }}.ocir.io
            docker pull ${{ secrets.OCIR_REGION_KEY }}.ocir.io/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}:prod-${{ github.sha }}
            docker stop server-prod || true
            docker rm server-prod || true
            docker run -d \
              --name server-prod \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /root/.env.prod \
              ${{ secrets.OCIR_REGION_KEY }}.ocir.io/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}:prod-${{ github.sha }}
            docker image prune -af

      - name: Notify Slack (Production Deploy)
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚀 *Production 배포가 완료되었습니다!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *Production 배포가 완료되었습니다!*\n\n*배포 항목:*\n✅ Client\n✅ Server\n\n*커밋:* ${{ github.event.head_commit.message }}\n*URL:* https://lets-codejam.vercel.app\n*작성자:* ${{ github.actor }}"
                  }
                }
              ]
            }
