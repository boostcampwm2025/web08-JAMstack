# ==============================================================================
# [주의] 수동 실행 및 로컬 개발 전용 (MANUAL USE ONLY) (오라클 서버 수동 배포에 사용되었습니다)
# ------------------------------------------------------------------------------
# 1. 이 파일은 GitHub Actions 자동 배포(OCIR) 파이프라인에 사용되지 않습니다.
# 2. 서버 배포는 cd-*.yml 워크플로우를 통해 'docker run' 방식으로 직접 수행됩니다.
# 3. 로컬 테스트나 서버에서 수동으로 컨테이너를 올릴 때만 수정/사용하세요.
# ==============================================================================

services:
  server-prod:
    # 수동 배포 기본 이미지 태그(호스트에서 compose up 시 사용)
    image: codejam-server:production
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    container_name: server-prod
    restart: unless-stopped
    env_file:
      - /root/.env.prod
    environment:
      # 컨테이너 네트워크 기준으로 Redis/DB/Piston에 접속
      REDIS_HOST: redis
      DB_HOST: db
      PISTON_API_URL: http://piston:2000/api/v2
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - codejam-net

  server-staging:
    # 수동 배포 기본 이미지 태그(호스트에서 compose up 시 사용)
    image: codejam-server:staging
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    container_name: server-staging
    restart: unless-stopped
    env_file:
      - /root/.env.staging
    environment:
      # 컨테이너 네트워크 기준으로 Redis/DB/Piston에 접속
      REDIS_HOST: redis
      DB_HOST: db
      PISTON_API_URL: http://piston:2000/api/v2
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - codejam-net

  redis:
    image: redis:7-alpine
    container_name: codejam-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - codejam-net

  db:
    image: postgres:18
    container_name: codejam-db
    restart: always
    environment:
      # Postgres는 첫 초기화 시 POSTGRES_DB 하나만 자동 생성
      POSTGRES_DB: codejam_prod
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - codejam-net

  piston:
    image: ghcr.io/engineer-man/piston:latest
    platform: linux/amd64
    container_name: codejam-piston
    privileged: true
    restart: unless-stopped
    volumes:
      - piston_data:/piston
    env_file:
      - ./apps/piston/.env
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - codejam-net

  caddy:
    image: caddy:2-alpine
    container_name: codejam-caddy
    restart: unless-stopped
    env_file:
      - /root/.env.caddy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile']
    depends_on:
      - server-prod
      - server-staging
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - codejam-net

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  piston_data:
    driver: local

networks:
  codejam-net:
    driver: bridge
